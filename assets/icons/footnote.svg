<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The footnote-section glyph: a miniature of the feature itself — body
       text above, the short flush-left separator rule, smaller note lines
       beneath it. Single-fill monochrome so the theme can tint it at the use
       site, like every asset in this directory. -->
  <rect x="3" y="4"    width="18"  height="1.7" rx="0.6" fill="#000000"/>
  <rect x="3" y="7.6"  width="18"  height="1.7" rx="0.6" fill="#000000"/>
  <rect x="3" y="12.6" width="7.5" height="1.5" rx="0.5" fill="#000000"/>
  <rect x="3" y="16.4" width="13.5" height="1.4" rx="0.5" fill="#000000"/>
  <rect x="3" y="19.4" width="9.5" height="1.4" rx="0.5" fill="#000000"/>
</svg>
