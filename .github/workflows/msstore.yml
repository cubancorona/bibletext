# Builds the Microsoft Store package: an unsigned MSIX (the Store signs it)
# around the same BibleText.exe the GitHub release ships, with the manifest
# filled from the reserved identity and the desktop ledger, and the tiles
# generated from icon/full.png. The .msix artifact is what gets uploaded in
# Partner Center; docs/WINDOWS_STORE_LISTING.md holds the listing.
#
# The smoke job then proves the package installs and launches: a COPY of the
# layout gets Mesa's software OpenGL (the runner has no GPU) and a throwaway
# self-signed certificate whose subject is the reserved publisher, is
# installed with Add-AppxPackage, activated through the shell like a Store
# install, and must still be running 30 s later. The Store package itself
# never carries Mesa or a signature of ours.
name: Microsoft Store package

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "msstore/**"
      - "cmd/msstore/**"
      - "scripts/build-windows-exe.sh"
      - ".github/workflows/msstore.yml"
      - "app.go"
      - "share_link_*.go"
      - "single_instance*.go"
      - "docs/windows-app-web-link"

permissions:
  contents: read

jobs:
  msix:
    name: pack and smoke-install (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: install fyne CLI
        run: go install fyne.io/tools/cmd/fyne@v1.7.2
      - name: build against the patched Fyne (Noto emoji + discrete caret blink)
        shell: bash
        run: |
          ./scripts/setup-fyne-patch.sh
          go mod edit -replace fyne.io/fyne/v2=./third_party/fyne
      - name: build BibleText.exe
        shell: bash
        env:
          BIBLETEXT_BUNDLED_KEY_ENC: ${{ secrets.BIBLETEXT_BUNDLED_KEY_ENC }}
        run: scripts/build-windows-exe.sh
      - name: lay out the package
        shell: bash
        run: |
          set -euo pipefail
          # The committed tiles must be the generator's own output and the
          # template must fill completely before anything is packed.
          go test ./cmd/msstore
          layout=build/msstore/layout
          mkdir -p "$layout"
          go run ./cmd/msstore manifest -out "$layout/AppxManifest.xml"
          cp cmd/desktop/BibleText.exe "$layout/"
          cp -r msstore/Assets "$layout/Assets"
          find "$layout" -type f | sort
      - name: makepri + makeappx
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = & scripts/windows-sdk-bin.ps1
          Write-Host "Windows SDK tools: $bin"
          $layout = (Resolve-Path build\msstore\layout).Path
          & "$bin\makepri.exe" createconfig /cf build\msstore\priconfig.xml /dq en-GB /pv 10.0.0 /o
          if ($LASTEXITCODE -ne 0) { throw "makepri createconfig failed" }
          & "$bin\makepri.exe" new /pr $layout /cf build\msstore\priconfig.xml /of build\msstore\resources.pri /o
          if ($LASTEXITCODE -ne 0) { throw "makepri new failed" }
          Copy-Item build\msstore\resources.pri $layout\
          & "$bin\makeappx.exe" pack /d $layout /p build\msstore\BibleText-Windows-x64.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx pack failed" }
          Get-Item build\msstore\BibleText-Windows-x64.msix | Format-List Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: BibleText-Windows-x64-msix
          path: build/msstore/BibleText-Windows-x64.msix
          if-no-files-found: error
      - name: smoke-install a signed copy with software OpenGL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bin = & scripts/windows-sdk-bin.ps1
          $id = Get-Content msstore\identity.json | ConvertFrom-Json
          $smoke = "build\msstore\smoke"
          Copy-Item build\msstore\layout $smoke -Recurse
          # Mesa llvmpipe beside the exe: the runner's VM has no OpenGL 2.0
          # (the same trick windows-visual-smoke.yml uses). Smoke copy only.
          $rel = Invoke-RestMethod https://api.github.com/repos/pal1000/mesa-dist-win/releases/latest
          $asset = $rel.assets | Where-Object { $_.name -like '*release-msvc.7z' } | Select-Object -First 1
          Write-Host "Using $($asset.name)"
          Invoke-WebRequest $asset.browser_download_url -OutFile build\msstore\mesa.7z
          7z x build\msstore\mesa.7z -obuild\msstore\mesa | Out-Null
          Copy-Item build\msstore\mesa\x64\*.dll $smoke\
          & "$bin\makeappx.exe" pack /d $smoke /p build\msstore\smoke.msix /o
          if ($LASTEXITCODE -ne 0) { throw "makeappx pack (smoke) failed" }
          # A throwaway certificate whose subject is the reserved publisher;
          # AppX install requires the subject to equal Identity/Publisher.
          $cert = New-SelfSignedCertificate -Type Custom -Subject $id.identityPublisher `
            -KeyUsage DigitalSignature -FriendlyName "BibleText smoke" `
            -CertStoreLocation Cert:\CurrentUser\My `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "smoke" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath build\msstore\smoke.pfx -Password $pw | Out-Null
          Import-PfxCertificate -FilePath build\msstore\smoke.pfx -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password $pw | Out-Null
          Import-PfxCertificate -FilePath build\msstore\smoke.pfx -CertStoreLocation Cert:\LocalMachine\Root -Password $pw | Out-Null
          & "$bin\signtool.exe" sign /fd SHA256 /a /f build\msstore\smoke.pfx /p smoke build\msstore\smoke.msix
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          reg add HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock /v AllowAllTrustedApps /t REG_DWORD /d 1 /f | Out-Null
          reg add HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock /v AllowDevelopmentWithoutDevLicense /t REG_DWORD /d 1 /f | Out-Null
          Add-AppxPackage -Path build\msstore\smoke.msix
          $pkg = Get-AppxPackage -Name $id.identityName
          if (-not $pkg) { throw "the package did not install" }
          Write-Host "installed $($pkg.PackageFullName)"
          if ($pkg.PackageFamilyName -ne $id.packageFamilyName) {
            throw "package family name $($pkg.PackageFamilyName) differs from msstore/identity.json ($($id.packageFamilyName))"
          }
          # What the installed package declares. Windows accepted the manifest,
          # so this proves the two link handlers are in the package as read.
          $m = Get-AppxPackageManifest -Package $pkg.PackageFullName
          $ext = @($m.Package.Applications.Application.Extensions.Extension)
          $uri = @($ext | Where-Object Category -eq 'windows.appUriHandler')
          if ($uri.Count -ne 1) { throw "expected one windows.appUriHandler extension, found $($uri.Count)" }
          if ($uri[0].AppUriHandler.Host.Name -ne 'bibletext.co.uk') { throw "AppUriHandler host is '$($uri[0].AppUriHandler.Host.Name)'" }
          $proto = @($ext | Where-Object Category -eq 'windows.protocol')
          if ($proto.Count -ne 1 -or $proto[0].Protocol.Name -ne 'bibletext') { throw "protocol declaration missing or misnamed" }
          # The site's consent file, checked by Windows' own verifier. The
          # control (a broken copy) must fail first, or the pass means nothing.
          $verifier = "$env:windir\System32\AppHostRegistrationVerifier.exe"
          if (Test-Path $verifier) {
            $broken = Join-Path $env:TEMP 'windows-app-web-link'
            (Get-Content docs\windows-app-web-link -Raw) -replace 'packageFamilyName', 'packageFamilyNam' | Set-Content $broken -NoNewline
            $out = & $verifier bibletext.co.uk $id.packageFamilyName $broken 2>&1
            if ($LASTEXITCODE -eq 0 -and -not $out) { throw "the verifier accepted a broken file; the check proves nothing" }
            $out = & $verifier bibletext.co.uk $id.packageFamilyName (Resolve-Path docs\windows-app-web-link).Path 2>&1
            if ($LASTEXITCODE -ne 0 -or $out) { throw "docs/windows-app-web-link fails validation: $out" }
            Write-Host "docs/windows-app-web-link validates for $($id.packageFamilyName)"
          } else {
            Write-Host "::warning::AppHostRegistrationVerifier.exe is not on this runner; the consent file was not validated"
          }
          function Wait-BibleText([int]$seconds) {
            for ($i = 0; $i -lt $seconds; $i++) {
              $p = Get-Process -Name BibleText -ErrorAction SilentlyContinue
              if ($p) { return $p }
              Start-Sleep 1
            }
            return $null
          }
          function CommandLineOf([int]$procId) { (Get-CimInstance Win32_Process -Filter "ProcessId=$procId").CommandLine }
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          function Shot([string]$name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($name, [System.Drawing.Imaging.ImageFormat]::Png)
            $g.Dispose(); $bmp.Dispose()
          }
          # 1. Plain activation, as from Start.
          cmd /c start "" "shell:AppsFolder\$($pkg.PackageFamilyName)!BibleText"
          Start-Sleep 30
          $proc = Get-Process -Name BibleText -ErrorAction SilentlyContinue
          Shot "build\msstore\smoke-30s.png"
          if (-not $proc) { throw "BibleText.exe is not running 30 s after activation" }
          Write-Host "BibleText.exe (pid $($proc.Id)) is running from $($proc.Path)"
          Stop-Process -Id $proc.Id -Force
          Start-Sleep 3
          # 2. The bibletext: scheme through the shell, cold. Protocol activation
          #    of a packaged app has no policy gate, and the command line shows
          #    exactly what Parameters delivered - fragment included.
          cmd /c start "" "bibletext://bibletext.co.uk/web/john/3/#v16"
          $p1 = Wait-BibleText 30
          if (-not $p1) { throw "BibleText.exe did not start from a bibletext: URL" }
          $cl = CommandLineOf $p1.Id
          Write-Host "scheme activation command line: $cl"
          if ($cl -notlike '*bibletext://bibletext.co.uk/web/john/3/#v16*') { throw "the URL (or its fragment) did not reach the command line: $cl" }
          Start-Sleep 30
          Shot "build\msstore\smoke-scheme.png"
          # 3. A second activation while running: the new process must hand the
          #    link to the first and exit - one process, the original pid.
          cmd /c start "" "bibletext://bibletext.co.uk/web/john/3/#v17"
          Start-Sleep 10
          $procs = @(Get-Process -Name BibleText -ErrorAction SilentlyContinue)
          if ($procs.Count -ne 1 -or $procs[0].Id -ne $p1.Id) { throw "second activation left $($procs.Count) process(es); the forwarder did not hand off and exit" }
          Write-Host "second activation handed off to pid $($p1.Id)"
          Stop-Process -Id $p1.Id -Force
          Start-Sleep 3
          # 4. An https link through the shell, cold - advisory here: whether a
          #    web-to-app handler fires on Windows Server depends on edition
          #    policy. A launch with a mangled URL is a failure; no launch is a
          #    warning for a Windows 11 client to settle.
          cmd /c start "" "https://bibletext.co.uk/web/john/3/#v16"
          $p2 = Wait-BibleText 30
          if ($p2) {
            $cl = CommandLineOf $p2.Id
            Write-Host "https activation command line: $cl"
            if ($cl -notlike '*https://bibletext.co.uk/web/john/3/#v16*') { throw "the web-to-app handler launched the app without the URL or its fragment: $cl" }
            Stop-Process -Id $p2.Id -Force
          } else {
            Write-Host "::warning::an https link did not launch the app on this runner (edition policy or browser default); needs a Windows 11 client check"
          }
          Remove-AppxPackage -Package $pkg.PackageFullName
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msstore-smoke-screenshots
          path: |
            build/msstore/smoke-30s.png
            build/msstore/smoke-scheme.png
          if-no-files-found: ignore
