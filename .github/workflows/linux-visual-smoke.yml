# Linux visual smoke test — runs the real Linux desktop build under Xvfb with
# Mesa's software OpenGL (llvmpipe) and captures screenshots as artifacts.
# Manual trigger: gh workflow run linux-visual-smoke.yml
#
# Why this exists: no Mac-local way to see the Linux build render (cgo + GL
# can't cross-compile, and macOS containers/VMs need extra setup), but a
# GitHub runner + Xvfb + llvmpipe exercises the genuine GLX/OpenGL path the
# app uses on real Linux desktops — same binary, same Fyne GL renderer, just
# a software rasterizer behind it.
name: Linux visual smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: install GL/X11 + xvfb + capture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev xvfb imagemagick mesa-utils
      - name: build the Linux desktop binary
        run: go build -o bibletext ./cmd/desktop
      - name: run under Xvfb (software GL) and capture
        run: |
          xvfb-run -s "-screen 0 1280x800x24" bash -c '
            set -x
            glxinfo | grep -E "OpenGL renderer|OpenGL version" || true
            LIBGL_ALWAYS_SOFTWARE=1 ./bibletext &
            APP=$!
            sleep 20;  import -window root shot-1-startup.png
            sleep 45;  import -window root shot-2-loaded.png
            sleep 10;  import -window root shot-3-settled.png
            kill $APP || true
          '
      - name: upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: linux-visual-smoke
          path: shot-*.png
          if-no-files-found: error
