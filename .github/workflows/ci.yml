name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: build & test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      # Fyne compiles against OpenGL + X11 development headers (cgo) on Linux.
      - name: Install Fyne system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  # The Linux job never compiles the darwin-tagged cgo (the native NSTextView
  # reading overlay + the macOS audio engine) or the ios-tagged files — i.e. the
  # app's primary platforms. This job builds and tests them on an Apple Silicon
  # runner and cross-compiles the iOS entry point (no signing needed).
  build-test-macos:
    name: build & test (macOS arm64) + iOS compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: iOS cross-compile (ios/arm64, no signing)
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos -f clang)"
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 CC="$CC" \
            CGO_CFLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=13.0" \
            CGO_LDFLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=13.0" \
            go build -o /tmp/bibletext-ios ./cmd/mobile
