name: CI
# Runs on branch pushes and pull requests into main.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    name: build & test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repository hygiene
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}..HEAD"
          else
            before="${{ github.event.before }}"
            if [ -n "$before" ] &&
               [ "$before" != "0000000000000000000000000000000000000000" ] &&
               git cat-file -e "$before^{commit}" 2>/dev/null; then
              range="$before..HEAD"
            else
              range="HEAD"
            fi
          fi
          scripts/check-repository-hygiene.py --history-range "$range"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      # Fyne compiles against OpenGL + X11 development headers (cgo) on Linux.
      - name: Install Fyne system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libasound2-dev

      - name: Release-key flow regression
        run: scripts/test-release-key-flow.sh

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      # Compile tag-gated evaluation translations and development-link panels
      # explicitly. Plain tagged tests are sufficient because the default race
      # run already covers the shared concurrency paths.
      - name: go vet (build tags)
        run: |
          go vet -tags nrsv ./...
          go vet -tags lsb ./...
          go vet -tags nrsv,lsb ./...
          go vet -tags bibletextdev ./...

      - name: go test (build tags)
        run: |
          go test -tags nrsv,lsb ./...
          go test -tags bibletextdev ./...

  # The Linux job never compiles the darwin-tagged cgo (the native NSTextView
  # reading overlay + the macOS audio engine) or the ios-tagged files — i.e. the
  # app's primary platforms. This job builds and tests them on an Apple Silicon
  # runner and cross-compiles the iOS entry point (no signing needed).
  build-test-macos:
    name: build & test (macOS arm64) + iOS compile
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...

      - name: iOS cross-compile (ios/arm64, no signing)
        run: |
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          CC="$(xcrun --sdk iphoneos -f clang)"
          CGO_ENABLED=1 GOOS=ios GOARCH=arm64 CC="$CC" \
            CGO_CFLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=13.0" \
            CGO_LDFLAGS="-isysroot $SDK -arch arm64 -miphoneos-version-min=13.0" \
            go build -o /tmp/bibletext-ios ./cmd/mobile

  # Windows is a supported desktop target (the Fyne fallback reading pane, not the
  # native overlay). This job builds + runs the full suite on real Windows; the
  # runner image ships a mingw gcc, so Fyne's cgo/OpenGL bindings compile. gofmt is
  # intentionally left to the linux job — running it here would false-positive on
  # the CRLF checkout.
  build-test-windows:
    name: build & test (windows)
    runs-on: windows-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race ./...
