# Desktop release builds. Pushing a tag like v1.1.2 builds BibleText for
# macOS (Apple Silicon + Intel), Windows, and Linux on GitHub's runners (the
# Fyne GL/cgo toolchains can't cross-compile from one host OS to another) and
# attaches the artifacts to a GitHub Release. The download page on GitHub Pages
# links to .../releases/latest/download/<asset>, so asset NAMES here are a
# stable public contract — don't rename them casually.
#
# iOS is NOT built here: the App Store pipeline is scripts/release-ios.sh
# (signing + the patched-Fyne step live on the Mac).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  create-release:
    name: create release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: verify public support configuration
        run: |
          python3 scripts/check-support-contact.py
          python3 scripts/check-release-identity.py "${GITHUB_REF_NAME}"
      - name: create the release (idempotent)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(printf 'Desktop builds for macOS, Windows, and Linux. iOS ships via the App Store: https://apps.apple.com/app/id6784567351\n\nThe Android APK is attached manually after the desktop assets land.\n\nmacOS note: the apps are unsigned - on first launch, right-click the app and choose Open.')"
          # --draft is load-bearing: publishing immediately reassigns
          # /releases/latest to this tag while the build jobs are still running,
          # so the download page would point at assets that are not available
          # yet. Publish only after every asset the jobs upload (the Linux job now adds the AppImage and its .zsync) plus the APK are attached:
          #   gh release upload <tag> BibleText-Android.apk --clobber
          #   gh release edit   <tag> --draft=false
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || \
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --title "BibleText ${GITHUB_REF_NAME#v}" \
            --notes "$NOTES"

  macos:
    name: build macOS (universal)
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: install fyne CLI
        run: go install fyne.io/tools/cmd/fyne@v1.7.2
      - name: build against the patched Fyne (Noto emoji + discrete caret blink)
        shell: bash
        run: |
          ./scripts/setup-fyne-patch.sh
          go mod edit -replace fyne.io/fyne/v2=./third_party/fyne
      - name: package one universal app
        shell: bash
        env:
          BIBLETEXT_BUNDLED_KEY_ENC: ${{ secrets.BIBLETEXT_BUNDLED_KEY_ENC }}
        run: |
          set -euo pipefail
          unset BIBLE_API_KEY ANTHROPIC_API_KEY OPENAI_API_KEY GEMINI_API_KEY XAI_API_KEY
          source scripts/release-bible-key.sh
          load_encoded_release_bible_key
          trap clear_release_bible_key EXIT
          # The macOS floor (config/product.json) must reach both the compile
          # — without -mmacosx-version-min the external linker stamps the
          # runner's SDK version as the binary's minos, and older loaders then
          # refuse the app — and the packaged plist, whose template hardcodes
          # 10.11. The grep after each package proves the flag arrived.
          MAC_MIN="$(python3 -c 'import json;print(json.load(open("config/product.json"))["macMinimumOSVersion"],end="")')"
          export CGO_CFLAGS="-mmacosx-version-min=$MAC_MIN" CGO_LDFLAGS="-mmacosx-version-min=$MAC_MIN"
          cd cmd/desktop
          # `fyne package` REWRITES FyneApp.toml's Build on success, and the
          # verification below reads the ledger back, so the committed value is
          # saved first and restored before it is read. One package call means
          # the two-zips-one-checkout hazard is gone: 1.2.5 shipped builds 46
          # and 47 for the same commit because the ledger advanced between them.
          cp FyneApp.toml "$RUNNER_TEMP/FyneApp.toml.original"
          trap 'clear_release_bible_key; cp "$RUNNER_TEMP/FyneApp.toml.original" "$GITHUB_WORKSPACE/cmd/desktop/FyneApp.toml" 2>/dev/null || true' EXIT
          # One slice per architecture, joined into a single binary, exactly as
          # scripts/release-mac-store.sh does for the Store upload — the direct
          # download differed from the Store build for no reason anyone chose.
          CGO_ENABLED=1 GOARCH=arm64 go build -trimpath -ldflags="$BIBLE_KEY_LDFLAGS -s -w" -o "$RUNNER_TEMP/desktop-arm64" .
          CGO_ENABLED=1 GOARCH=amd64 go build -trimpath -ldflags="$BIBLE_KEY_LDFLAGS -s -w" -o "$RUNNER_TEMP/desktop-amd64" .
          lipo -create -output desktop "$RUNNER_TEMP/desktop-arm64" "$RUNNER_TEMP/desktop-amd64"
          lipo -info desktop
          $(go env GOPATH)/bin/fyne package -os darwin --app-id uk.co.bibletext --executable desktop
          rm -f desktop
          /usr/libexec/PlistBuddy -c "Set :LSMinimumSystemVersion $MAC_MIN" BibleText.app/Contents/Info.plist
          # Both architectures must be in the packaged binary. `fyne package`
          # is given the joined file, but a packager that rebuilt instead of
          # copying would silently ship one slice, and the zip would still look
          # right from the outside.
          PACKAGED_ARCHS="$(lipo -info BibleText.app/Contents/MacOS/desktop)"
          echo "$PACKAGED_ARCHS"
          for arch in arm64 x86_64; do
            case "$PACKAGED_ARCHS" in
              *"$arch"*) ;;
              *) echo "the packaged binary has no $arch slice: $PACKAGED_ARCHS" >&2; exit 1 ;;
            esac
          done
          # The loader enforces each slice's own minos, so both are checked —
          # one slice linked for a newer macOS would refuse to start on the
          # floor the listing promises.
          MINOS_SEEN="$(otool -l BibleText.app/Contents/MacOS/desktop | awk '/LC_BUILD_VERSION/{v=1} v && $1=="minos"{print $2; v=0}')"
          [ -n "$MINOS_SEEN" ] || { echo "no LC_BUILD_VERSION minos in the universal binary" >&2; exit 1; }
          SLICES="$(printf '%s\n' "$MINOS_SEEN" | wc -l | tr -d ' ')"
          [ "$SLICES" = "2" ] || { echo "expected 2 slices with a minos, found $SLICES" >&2; exit 1; }
          for m in $MINOS_SEEN; do
            [ "$m" = "$MAC_MIN" ] || { echo "a slice is linked for macOS $m, not $MAC_MIN" >&2; exit 1; }
          done
          BIBLETEXT_RELEASE_LDFLAGS="$BIBLE_KEY_LDFLAGS" ../../scripts/verify-release-package.sh BibleText.app/Contents/MacOS/desktop BibleText.app
          ditto -c -k --keepParent BibleText.app ../../BibleText-macOS.zip
          rm -rf BibleText.app
          cp "$RUNNER_TEMP/FyneApp.toml.original" FyneApp.toml
          # The zip carries the committed Build. Prove it rather than trusting
          # it: the number in the bundle must be the number in the ledger, or
          # the release is stamped with one nobody chose.
          LEDGER_BUILD="$(sed -n 's/^Build = \([0-9]*\)/\1/p' FyneApp.toml)"
          cd ../..
          rm -rf /tmp/verify-zip && mkdir -p /tmp/verify-zip
          ditto -x -k BibleText-macOS.zip /tmp/verify-zip
          got="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' /tmp/verify-zip/BibleText.app/Contents/Info.plist)"
          [ "$got" = "$LEDGER_BUILD" ] || { echo "BibleText-macOS.zip carries build $got, ledger says $LEDGER_BUILD" >&2; exit 1; }
          echo "BibleText-macOS.zip: build $got, universal"
      - name: upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" BibleText-macOS.zip --clobber

  linux:
    name: build Linux (amd64)
    needs: create-release
    # Pinned: the tarball and the AppImage run on any glibc at or above the
    # one they were built against, and ubuntu-latest drifts upward
    # (scripts/check-glibc-floor.sh holds the floor at Ubuntu 22.04's 2.35).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: install GL/X11 headers and the packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libasound2-dev \
            desktop-file-utils appstream zsync binutils
      - name: build against the patched Fyne (Noto emoji + discrete caret blink)
        shell: bash
        run: |
          ./scripts/setup-fyne-patch.sh
          go mod edit -replace fyne.io/fyne/v2=./third_party/fyne
      - name: build the patched fyne CLI (Linux scheme-handler desktop entry)
        shell: bash
        run: |
          ./scripts/setup-fyne-tools-patch.sh
          (cd third_party/fyne-tools && go build -trimpath -o "$GITHUB_WORKSPACE/build/fyne-cli/fyne" ./cmd/fyne)
      - name: package
        shell: bash
        env:
          BIBLETEXT_BUNDLED_KEY_ENC: ${{ secrets.BIBLETEXT_BUNDLED_KEY_ENC }}
        run: |
          set -euo pipefail
          unset BIBLE_API_KEY ANTHROPIC_API_KEY OPENAI_API_KEY GEMINI_API_KEY XAI_API_KEY
          source scripts/release-bible-key.sh
          load_encoded_release_bible_key
          trap clear_release_bible_key EXIT
          cd cmd/desktop
          CGO_ENABLED=1 GOARCH=amd64 go build -trimpath -ldflags="$BIBLE_KEY_LDFLAGS -s -w" -o desktop .
          "$GITHUB_WORKSPACE/build/fyne-cli/fyne" package -os linux --app-id uk.co.bibletext --executable desktop
          mv BibleText.tar.xz ../../BibleText-Linux-amd64.tar.xz
          # Every assertion a packaged Linux tarball must satisfy, on any
          # architecture, lives in one script so the amd64 and arm64 jobs
          # cannot drift apart and quietly stop checking the same things.
          BIBLE_KEY_LDFLAGS="$BIBLE_KEY_LDFLAGS" \
            ../../scripts/check-linux-package.sh ../../BibleText-Linux-amd64.tar.xz 2.35
          # The AppImage, from the very same executable; verified again once
          # extracted, since the marker cannot be read through the squashfs.
          cd "$GITHUB_WORKSPACE"
          scripts/build-appimage.sh cmd/desktop/desktop BibleText-x86_64.AppImage
          rm -rf squashfs-root
          ./BibleText-x86_64.AppImage --appimage-extract >/dev/null
          grep -q '^Exec=bibletext %u$' squashfs-root/uk.co.bibletext.BibleText.desktop
          grep -q '^MimeType=x-scheme-handler/bibletext;' squashfs-root/uk.co.bibletext.BibleText.desktop
          BIBLETEXT_RELEASE_LDFLAGS="$BIBLE_KEY_LDFLAGS" scripts/verify-release-package.sh squashfs-root/usr/bin/bibletext squashfs-root
          rm -rf squashfs-root
          # The snap job packages this same executable.
          install -Dm755 cmd/desktop/desktop build/snap-stage/bin/bibletext
          install -Dm644 linux/asound.conf build/snap-stage/etc/asound.conf
      - uses: actions/upload-artifact@v4
        with:
          name: snap-stage
          path: build/snap-stage
          if-no-files-found: error
          retention-days: 3
      - name: upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" BibleText-Linux-amd64.tar.xz BibleText-x86_64.AppImage BibleText-x86_64.AppImage.zsync --clobber

  snap:
    name: build snap (amd64)
    needs: linux
    runs-on: ubuntu-24.04
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: snap-stage
          path: build/snap-stage
      - run: chmod 755 build/snap-stage/bin/bibletext
      - id: snapcraft
        uses: snapcore/action-build@v1
      - name: install and assert the exported entry
        shell: bash
        env:
          SNAP_FILE: ${{ steps.snapcraft.outputs.snap }}
        run: |
          set -euo pipefail
          sudo snap install --dangerous "$SNAP_FILE"
          entry=/var/lib/snapd/desktop/applications/bibletext_bibletext.desktop
          grep -q '^MimeType=x-scheme-handler/bibletext;' "$entry"
          grep -q '^Exec=.*bibletext %u$' "$entry"
      - uses: actions/upload-artifact@v4
        with:
          name: bibletext-snap
          path: ${{ steps.snapcraft.outputs.snap }}
      # Publishing needs the store login exported for the registered name
      # (docs/LINUX_STORES.md); until that secret exists the snap is an
      # artifact only. Promotion beyond edge is by hand after a desktop test.
      - name: publish to edge
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: edge

  linux-arm64:
    name: build Linux (arm64)
    needs: create-release
    # Free on public repositories. The AppImage is deliberately NOT built here:
    # scripts/build-appimage.sh pins an x86_64 appimagetool and runtime by
    # sha256, so arm64 ships the tarball and the snap until that is done
    # properly rather than half-done with an unpinned tool.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: install GL/X11/ALSA headers and the packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libasound2-dev \
            desktop-file-utils appstream binutils
      - name: build against the patched Fyne (Noto emoji + discrete caret blink)
        shell: bash
        run: |
          ./scripts/setup-fyne-patch.sh
          go mod edit -replace fyne.io/fyne/v2=./third_party/fyne
      - name: build the patched fyne CLI (Linux scheme-handler desktop entry)
        shell: bash
        run: |
          ./scripts/setup-fyne-tools-patch.sh
          (cd third_party/fyne-tools && go build -trimpath -o "$GITHUB_WORKSPACE/build/fyne-cli/fyne" ./cmd/fyne)
      - name: package
        shell: bash
        env:
          BIBLETEXT_BUNDLED_KEY_ENC: ${{ secrets.BIBLETEXT_BUNDLED_KEY_ENC }}
        run: |
          set -euo pipefail
          unset BIBLE_API_KEY ANTHROPIC_API_KEY OPENAI_API_KEY GEMINI_API_KEY XAI_API_KEY
          source scripts/release-bible-key.sh
          load_encoded_release_bible_key
          trap clear_release_bible_key EXIT
          cd cmd/desktop
          CGO_ENABLED=1 GOARCH=arm64 go build -trimpath -ldflags="$BIBLE_KEY_LDFLAGS -s -w" -o desktop .
          "$GITHUB_WORKSPACE/build/fyne-cli/fyne" package -os linux --app-id uk.co.bibletext --executable desktop
          mv BibleText.tar.xz ../../BibleText-Linux-arm64.tar.xz
          BIBLE_KEY_LDFLAGS="$BIBLE_KEY_LDFLAGS" \
            ../../scripts/check-linux-package.sh ../../BibleText-Linux-arm64.tar.xz 2.35
          cd "$GITHUB_WORKSPACE"
          install -Dm755 cmd/desktop/desktop build/snap-stage/bin/bibletext
          install -Dm644 linux/asound.conf build/snap-stage/etc/asound.conf
      - uses: actions/upload-artifact@v4
        with:
          name: snap-stage-arm64
          path: build/snap-stage
          if-no-files-found: error
          retention-days: 3
      - name: upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" BibleText-Linux-arm64.tar.xz --clobber

  snap-arm64:
    name: build snap (arm64)
    needs: linux-arm64
    runs-on: ubuntu-24.04-arm
    env:
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: snap-stage-arm64
          path: build/snap-stage
      - run: chmod 755 build/snap-stage/bin/bibletext
      # Snap layouts take no variables and snapcraft will not vary one per
      # platform, so the committed snapcraft.yaml is the amd64 render and this
      # job re-renders for arm64 first. The layout binds a REAL path: an arm64
      # snap carrying the x86_64 ALSA triplet builds, packs, installs and
      # launches perfectly, and has no narration audio at all.
      - name: render the snap for arm64
        run: |
          go run ./cmd/linuxmeta render -arch arm64
          grep -q '^  arm64:' snap/snapcraft.yaml
          grep -q 'bind: \$SNAP/usr/lib/aarch64-linux-gnu/alsa-lib' snap/snapcraft.yaml
      - id: snapcraft
        uses: snapcore/action-build@v1
      - name: install and assert the exported entry
        shell: bash
        env:
          SNAP_FILE: ${{ steps.snapcraft.outputs.snap }}
        run: |
          set -euo pipefail
          sudo snap install --dangerous "$SNAP_FILE"
          entry=/var/lib/snapd/desktop/applications/bibletext_bibletext.desktop
          grep -q '^MimeType=x-scheme-handler/bibletext;' "$entry"
          grep -q '^Exec=.*bibletext %u$' "$entry"
          # The ALSA plugins must actually resolve inside the confinement, not
          # merely be present in the squashfs.
          sudo snap run --shell bibletext -c 'ls /usr/lib/aarch64-linux-gnu/alsa-lib/ >/dev/null'
      - uses: actions/upload-artifact@v4
        with:
          name: bibletext-snap-arm64
          path: ${{ steps.snapcraft.outputs.snap }}
      - name: publish to edge
        if: env.SNAPCRAFT_STORE_CREDENTIALS != ''
        uses: snapcore/action-publish@v1
        with:
          snap: ${{ steps.snapcraft.outputs.snap }}
          release: edge

  windows:
    name: build Windows (${{ matrix.goarch }})
    needs: create-release
    # Windows on ARM runs the x64 build under emulation, so it works today and
    # a native package is the difference between working and belonging on the
    # machine. `angle` is the spelling the ANGLE release uses, `goarch` Go's.
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: amd64
            angle: x64
            runner: windows-latest
          - goarch: arm64
            angle: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: true
      - name: install fyne CLI
        run: go install fyne.io/tools/cmd/fyne@v1.7.2
      - name: build against the patched Fyne (Noto emoji + discrete caret blink)
        shell: bash
        run: |
          ./scripts/setup-fyne-patch.sh
          go mod edit -replace fyne.io/fyne/v2=./third_party/fyne
      # The runner image's gcc is x86_64 even on the ARM machine, so cgo cannot
      # assemble aarch64. Skipped on amd64, which already has a matching one.
      - name: aarch64 C toolchain
        if: matrix.goarch == 'arm64'
        shell: pwsh
        run: |
          $bin = & scripts/fetch-llvm-mingw.ps1 -Dest "$env:RUNNER_TEMP\toolchains" | Select-Object -Last 1
          "$bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CC=$bin\aarch64-w64-mingw32-clang.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: package
        shell: bash
        env:
          BIBLETEXT_BUNDLED_KEY_ENC: ${{ secrets.BIBLETEXT_BUNDLED_KEY_ENC }}
          WIN_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          unset BIBLE_API_KEY ANTHROPIC_API_KEY OPENAI_API_KEY GEMINI_API_KEY XAI_API_KEY
          source scripts/release-bible-key.sh
          load_encoded_release_bible_key
          trap clear_release_bible_key EXIT
          cd cmd/desktop
          # EXPORTED, not a command prefix: `fyne package` below rebuilds the
          # executable, and a prefix assignment would not reach it.
          export GOARCH="${WIN_GOARCH:-amd64}"
          CGO_ENABLED=1 go build -tags gles -trimpath -ldflags="$BIBLE_KEY_LDFLAGS -s -w" -o BibleText.exe .
          # Fyne's Windows packager rebuilds the target to add icon/version
          # resources. GOFLAGS keeps that metadata pass trimmed and stripped,
          # and the tag must be repeated or that rebuild drops the ES path.
          GOFLAGS="-trimpath -ldflags=-s -ldflags=-w -ldflags=$BIBLE_KEY_LDFLAGS" "$(go env GOPATH)/bin/fyne" package -os windows --tags gles --app-id uk.co.bibletext --executable BibleText.exe
          BIBLETEXT_RELEASE_LDFLAGS="$BIBLE_KEY_LDFLAGS" ../../scripts/verify-release-package.sh BibleText.exe BibleText.exe
          cd ../..
      - name: ANGLE beside the executable (the app renders through Direct3D)
        shell: pwsh
        run: pwsh scripts/fetch-angle.ps1 -Dest cmd\desktop -Arch ${{ matrix.angle }}
      - name: zip
        shell: bash
        run: |
          set -euo pipefail
          7z a BibleText-Windows-${{ matrix.goarch }}.zip ./cmd/desktop/BibleText.exe \
            ./cmd/desktop/libEGL.dll ./cmd/desktop/libGLESv2.dll \
            ./cmd/desktop/d3dcompiler_47.dll ./cmd/desktop/ANGLE-LICENSE.txt
      - name: upload asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release upload "${GITHUB_REF_NAME}" BibleText-Windows-${{ matrix.goarch }}.zip --clobber
