# The Linux listing: the one hand-written source for Flathub, the Snap Store
# and the AppImage. `go run ./cmd/linuxmeta render` turns it into the AppStream
# MetaInfo, the desktop entries, the icons, snap/snapcraft.yaml and the
# Flatpak manifest; the tests in cmd/linuxmeta hold the committed outputs
# equal to a fresh render. Identity (name, site, support page, repository)
# comes from config/product.json; the version from cmd/bibletext/FyneApp.toml;
# release dates and notes from linux/releases.toml. Edit here, never the
# outputs. docs/LINUX_STORES.md carries the reasoning for every value.

appstream_id = "uk.co.bibletext.BibleText"
executable = "bibletext"
summary = "Read and study Scripture" # Flathub: at most 35 characters, no full stop, no article; Snap: at most 78
generic_name = "Bible reader"
developer_id = "uk.co.bibletext"
developer = "cubancorona" # the copyright holder in LICENSE and NOTICE; a domain-style name is not allowed here
metadata_license = "CC0-1.0" # Flathub accepts CC0-1.0 or FSFAP for the metadata itself
project_license = "Apache-2.0"
categories = ["Education", "Spirituality"]
keywords = ["Bible", "Scripture", "NKJV", "Berean", "WEB", "BSB", "Catholic", "deuterocanon", "audio", "narration", "notes", "offline"]
brand_light = "#2F4C86" # the app's own accent, theme.go
brand_dark = "#7CA0E4"
scheme_mediatype = "x-scheme-handler/bibletext"

intro = "BibleText is a clean, unhurried place to read Scripture. No ads, no accounts, no tracking — just the text, carefully set, with the tools you use while reading."
features = [
  "Four translations: World English Bible, WEB Catholic with the deuterocanon, Berean Standard Bible, and the New King James Version through API.Bible",
  "Words of Christ in red, the publishers' own headings and paragraphs, poetry set as poetry",
  "Search, cross-references and Gospel parallels; Go to for references such as John 3:16",
  "Notes carried inside a shared link — no account, no server",
  "Recorded public-domain narration with read-along highlighting",
  "Optional AI study with your own provider key; leave Assistant set to None to switch it off",
]
outro = "Works offline once a translation has downloaded. Free and open source."
# Rendered only into the Flathub metainfo (Flathub builds from source, without the bundled key):
keyless_note = "This build carries no API.Bible key: add your own free key under Settings to read the NKJV."

[oars] # OARS 1.1; every attribute not listed is "none". Nothing applies:
# no chat, purchases, ads, location or accounts, and no information about
# the reader leaves the device to us — Scripture and narration are fetched
# from their providers, and the AI feature sends the reader's own questions
# to the provider the reader chose under the reader's own account.

[screenshots]
# Commit-pinned raw.githubusercontent.com URLs, so the listing does not churn
# every release. All zeros means "not captured yet": the <screenshots> block
# is left out until docs/screenshots/linux/ exists and this names its commit.
# Captured by .github/workflows/linux-screenshots.yml; docs/screenshots/README.md
# says how to replace them.
ref = "06f0b1cc60a7aca9ab313d4773612a27f9087921"
[[screenshots.item]]
file = "reading.png"
caption = "Reading John 3 in the Berean Standard Bible, with the words of Christ in red"
[[screenshots.item]]
file = "search.png"
caption = "Search results and cross-references beside the text"
[[screenshots.item]]
